name: Windows portable WOPR

on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'windows/**', 'tests/**', 'requirements-*.txt', '.github/workflows/windows.yml', 'THIRD_PARTY_NOTICES.txt']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt -r requirements-test.txt
      - name: Install browser for real integration checks
        run: python -m playwright install chromium
      - name: Validate PowerShell launcher without running it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'windows/Launch-WOPR.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Unit tests and syntax checks
        run: |
          python -m compileall -q windows tests
          python -m unittest discover -s tests -v
      - name: Build and smoke-test portable ZIP
        run: python windows/build_windows.py
      - name: Browser integration with built offline speech engine
        shell: pwsh
        run: |
          $env:WOPR_TEST_SPEECH = Join-Path $PWD 'dist/WOPR/speech/espeak-ng.exe'
          python -m unittest discover -s tests -p test_live_browser.py -v
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WOPR-Windows-x64
          path: |
            dist/WOPR-Windows-x64.zip
            dist/WOPR-Windows-x64.zip.sha256
          if-no-files-found: error
