# WOPR JOSHUA voice synthesis endpoint.
# Installed by install.sh into /etc/nginx/snippets/ and included from the
# default site's server {} block.
location /api/speak {
    gzip off;
    fastcgi_pass unix:/var/run/fcgiwrap.socket;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/local/bin/wopr-speak.cgi;
    fastcgi_param QUERY_STRING $query_string;
}
